<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slack Export Cache</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1d21;
    color: #fff;
    margin: 0;
    padding: 24px 32px 48px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.subtitle {
    opacity: 0.6;
    font-size: 13px;
    margin: 0 0 24px;
  }
  #empty-state {
    opacity: 0.6;
    font-size: 13px;
  }
  #list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 640px;
  }
  .row {
    background: #23272b;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .row-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .row-meta {
    opacity: 0.7;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .row-actions {
    display: flex;
    gap: 8px;
  }
  button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: #3a3f44;
    color: #fff;
  }
  button:hover {
    background: #4a4f54;
  }
  button.danger {
    background: transparent;
    color: #f28b82;
    border: 1px solid #5c3330;
  }
  button.danger:hover {
    background: #3a2624;
  }
</style>
</head>
<body>
  <h1>Cached Slack conversations</h1>
  <p class="subtitle">Data stored locally by the export panel's "memory" feature. Download a conversation's full cached history, or clear it to force a fresh full sync next time.</p>
  <div id="empty-state" hidden>No cached conversations yet — export a conversation from the Slack tab panel first.</div>
  <div id="list"></div>
  <script src="html-export.js"></script>
  <script src="manager.js"></script>
</body>
</html>
